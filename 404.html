<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Superstition Detailing</title>
<script>
  // pretty invoice links: /invoice/192012 -> /invoice.html?id=192012
  // pretty builder link:  /buildinvoice   -> /buildinvoice.html
  var p = location.pathname;
  var m = p.match(/^\/invoice\/(\w+)\/?$/);
  if (m) { location.replace('/invoice.html?id=' + m[1]); }
  else if (/^\/buildinvoice\/?$/.test(p)) { location.replace('/buildinvoice.html'); }
</script>
